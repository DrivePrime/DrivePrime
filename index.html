<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Drive Prime | Location de voitures premium à Marrakech</title>
    <meta name="description" content="Location de voitures à Marrakech, de la citadine au Range Rover et au Mercedes Classe G. Tarifs à la journée et réservation directe sur WhatsApp." />
    <link rel="canonical" href="https://driveprimecar.com/" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Drive Prime" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://driveprimecar.com/" />
    <meta property="og:title" content="Drive Prime | Location de voitures premium à Marrakech" />
    <meta property="og:description" content="De la citadine au Mercedes Classe G : tarifs à la journée et réservation directe sur WhatsApp." />
    <meta property="og:image" content="https://driveprimecar.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://driveprimecar.com/og-image.jpg" />

    <!-- Self-hosted fonts (src/fonts.css); preload the Latin face used above the fold -->
    <link rel="preload" href="/fonts/archivo-latin-400-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Hide prerendered French markup until the app renders the visitor's saved language/currency */
      .csr #root { visibility: hidden; }
    </style>
    <script>
      // Runs before the app: apply a saved language/currency preference early.
      try {
        // Scroll reveals only hide content when JS runs and the visitor allows motion.
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("js-motion");
        var lang = localStorage.getItem("language");
        var cur = localStorage.getItem("currency");
        if ((lang && lang !== "fr") || cur === "MAD") document.documentElement.classList.add("csr");
        if (lang === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
          // Fetch the Arabic faces now so text does not reflow when they arrive.
          ["400", "600"].forEach(function (w) {
            var l = document.createElement("link");
            l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
            l.href = "/fonts/ibm-plex-sans-arabic-arabic-" + w + ".woff2";
            document.head.appendChild(l);
          });
        } else if (lang === "en") {
          document.documentElement.lang = "en";
        }
      } catch (e) {}
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRental",
        "name": "Drive Prime",
        "url": "https://driveprimecar.com/",
        "image": "https://driveprimecar.com/og-image.jpg",
        "logo": "https://driveprimecar.com/apple-touch-icon.png",
        "telephone": "+212612132748",
        "email": "contact.drive.prime@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Marrakech",
          "addressCountry": "MA"
        },
        "sameAs": [
          "https://www.instagram.com/location_drive_prime_",
          "https://www.tiktok.com/@drive.prime"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
